name: Build Strobo HTML preview
on:
  push:
    branches: [feat/1265-strobo-preview]
    paths:
      - strobo.html
      - LICENSE
      - Dockerfile.preview
      - .dockerignore
      - .github/workflows/preview.yml
permissions: {}
concurrency:
  group: strobo-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preview:
    if: github.run_attempt == 1 && github.repository == 'skunklabs-uk/arduino-aircraft-strobo'
    runs-on: ci-container
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/skunklabs-uk/arduino-aircraft-strobo-preview:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build the static preview
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --load --platform linux/amd64 \
            --file Dockerfile.preview --tag "$IMAGE" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
      - name: Verify HTTP serves the exact HTML and license
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker run -d --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL --security-opt no-new-privileges --user 101:101 "$IMAGE")
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          ready=false
          for attempt in {1..30}; do
            if docker exec "$container_id" wget -q -O /tmp/index.html http://127.0.0.1:8080/; then
              ready=true
              break
            fi
            sleep 1
          done
          "$ready"
          docker exec "$container_id" cat /tmp/index.html > "$RUNNER_TEMP/strobo-served.html"
          cmp strobo.html "$RUNNER_TEMP/strobo-served.html"
          docker exec "$container_id" wget -q -O - http://127.0.0.1:8080/LICENSE > "$RUNNER_TEMP/strobo-license"
          cmp LICENSE "$RUNNER_TEMP/strobo-license"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse overwriting the SHA coordinate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          result=$(docker manifest inspect "$IMAGE" 2>&1)
          status=$?
          set -e
          if (( status == 0 )); then
            echo 'SHA coordinate already exists; refusing overwrite' >&2
            exit 1
          fi
          if ! grep -Eqi 'manifest unknown|no such manifest|not found' <<< "$result"; then
            echo "$result" >&2
            exit 1
          fi
      - name: Publish the tested image and record its digest
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          digest_ref=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          [[ "$digest_ref" =~ @sha256:[a-f0-9]{64}$ ]]
          printf 'Source: `%s`\n\nImage: `%s`\n' "$GITHUB_SHA" "$digest_ref" >> "$GITHUB_STEP_SUMMARY"
